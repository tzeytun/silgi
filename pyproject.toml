[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "silgi"
version = "0.1.0"
description = "Remove watermarks, logos and text from images without touching the rest. Offline, deterministic, no AI."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "assets/brand/LICENSE-fonts.txt"]
requires-python = ">=3.11"
authors = [{ name = "silgi contributors" }]
keywords = [
  "image-processing",
  "watermark-removal",
  "inpainting",
  "patchmatch",
  "opencv",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics :: Editors :: Raster-Based",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "scipy>=1.11",
  "numba>=0.60",
  "pillow>=10.3",
  "tifffile>=2024.1.30",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
heic = ["pillow-heif>=0.16"]
window = ["pywebview>=5.0"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-socket>=0.7",
  "hypothesis>=6.100",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "fonttools[woff]>=4.50",
  "playwright>=1.44",
]

[project.scripts]
silgi = "silgi.cli:main"

[project.urls]
Homepage = "https://github.com/tzeytun/silgi"
Issues = "https://github.com/tzeytun/silgi/issues"
Changelog = "https://github.com/tzeytun/silgi/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/silgi"]
artifacts = ["src/silgi/web/**"]

[tool.hatch.build.targets.sdist]
include = [
  "src/silgi",
  "tests",
  "scripts/make_samples.py",
  "assets/brand",
  "LICENSE",
  "README.md",
  "CHANGELOG.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --disable-socket --allow-unix-socket --allow-hosts=127.0.0.1,localhost,::1"
markers = ["slow: long-running quality tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.coverage.run]
source = ["silgi"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "NPY", "PT"]
ignore = ["N803", "N806", "N818", "E741", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["silgi"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "silgi.core.*"
strict = true

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Depends", "fastapi.Query"]
